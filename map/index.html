<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#332242">
  <meta name="description" content="PUNCH ’N’ GO — интерактивная иллюстрированная карта фэнтезийного приключения.">
  <title>PUNCH ’N’ GO — Карта приключения</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900;1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=1">
  <script defer src="./art.js?v=1"></script>
  <script defer src="./map.js?v=1"></script>
</head>
<body>
  <div class="desktop-note"><span>✦ PUNCH ’N’ GO · MAP PROTOTYPE</span><a href="../">← К UX-flow</a></div>
  <main class="game" aria-label="Главный экран и карта приключения PUNCH ’N’ GO">
    <header class="topbar">
      <div class="identity">
        <div class="brand"><span>PUNCH</span><strong>’N’ GO</strong></div>
        <div class="hero" aria-label="Портрет героя">
          <svg viewBox="0 0 62 64" aria-hidden="true"><path d="M5 52Q7 38 21 35H48Q59 41 59 61H3Z" fill="#e97361" stroke="#312638" stroke-width="3"/><path d="M12 26Q12 8 31 8T51 25Q51 42 32 44Q15 42 12 26Z" fill="#ffe0ad" stroke="#312638" stroke-width="3"/><path d="M9 20Q15 9 9 7Q20 9 23 2Q29 10 39 4Q43 13 53 14L48 22Q31 14 16 26Z" fill="#fff5db" stroke="#312638" stroke-width="3" stroke-linejoin="round"/><path d="M10 24L51 22" stroke="#e45d57" stroke-width="5"/><path d="M12 24Q5 33 1 30M14 26L6 37" stroke="#e45d57" stroke-width="4" stroke-linecap="round"/><circle cx="27" cy="27" r="2.3" fill="#312638"/><circle cx="42" cy="27" r="2.3" fill="#312638"/><path d="M30 34Q36 42 42 34" fill="none" stroke="#312638" stroke-width="2.8" stroke-linecap="round"/><path d="M43 51Q45 41 53 43Q63 44 60 57L52 65L40 61Z" fill="#87669b" stroke="#312638" stroke-width="3"/><path d="M47 51L53 48L57 53L52 59Z" fill="#ffda59" stroke="#312638" stroke-width="2"/></svg>
          <span class="hero-level">7</span>
        </div>
      </div>
      <div class="resources">
        <button class="resource resource-coin" data-sheet="coins" aria-label="Монеты: 4560, демонстрационная экономика">
          <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#f9b929" stroke="#35273b" stroke-width="2.8"/><circle cx="14" cy="14" r="8.6" fill="#ffe56a" stroke="#e78a24" stroke-width="1.6"/><path d="m7.5 10 4 3 2.5-5 2.5 5 4-3-1.3 8H8.8Z" fill="#e99115" stroke="#a86521" stroke-width="1.2"/></svg>
          <span>4 560</span><b>+</b>
        </button>
        <button class="resource resource-gem" data-sheet="gems" aria-label="Кристаллы: 260, демонстрационная экономика">
          <svg viewBox="0 0 28 28" aria-hidden="true"><path d="m7 3 13 0 6 9-12 14L2 12Z" fill="#b65de9" stroke="#35273b" stroke-width="2.4"/><path d="M7 3 14 26 2 12ZM20 3 14 26 26 12Z" fill="#e69dff"/><path d="m7 3 7 7 6-7 6 9H2Z" fill="#8e54d1"/></svg>
          <span>260</span><b>+</b>
        </button>
      </div>
      <button class="settings icon-btn" data-sheet="settings" aria-label="Настройки и демо-сценарии">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12.7 3h6.6l.7 4.3a9 9 0 0 1 2.4 1.5l4.2-1.4 3.2 5.6-3.5 2.7a10 10 0 0 1 0 2.7l3.5 2.7-3.2 5.6-4.2-1.4a9 9 0 0 1-2.4 1.5l-.7 4.3h-6.6l-.7-4.3a9 9 0 0 1-2.4-1.5l-4.2 1.4-3.2-5.6 3.5-2.7a10 10 0 0 1 0-2.7l-3.5-2.7 3.2-5.6 4.2 1.4A9 9 0 0 1 12 7.3Z" fill="#c3b6d9" stroke="#382a46" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="16" r="5.1" fill="#f9efd4" stroke="#382a46" stroke-width="2.4"/></svg>
      </button>
    </header>

    <div class="map-scroll" id="mapScroll" tabindex="0" aria-label="Вертикально прокручиваемая карта мира">
      <div class="world" id="world">
        <svg id="worldIllustration" class="world-art" viewBox="0 0 390 2320" preserveAspectRatio="none" aria-label="Иллюстрация карты: лесная тропа, река, камни, замок, снежные горы"></svg>
        <div class="zone-title zone-title-two" data-x="202" data-y="570">
          <span class="small">ЗОНА 2</span><strong>Ледяные вершины</strong><span class="zone-lock">🔒 Закрыта</span>
        </div>
        <div class="zone-title zone-title-one" data-x="156" data-y="1158">
          <span class="small">ЗОНА 1</span><strong>Лесные тропы</strong>
          <span class="small last">ТРИ СЮЖЕТНЫХ ЭТАПА</span>
        </div>

        <button class="stage-node stage-node-locked" data-level="2-3" data-x="161" data-y="246" aria-label="Зона 2, этап 2-3, закрыт">
          <span class="stage-medal">♜</span><span class="stage-ribbon">2-3</span>
        </button>
        <button class="stage-node stage-node-locked" data-level="2-2" data-x="272" data-y="500" aria-label="Зона 2, этап 2-2, закрыт">
          <span class="stage-medal">◆</span><span class="stage-ribbon">2-2</span>
        </button>
        <button class="stage-node stage-node-locked" data-level="2-1" data-x="93" data-y="833" aria-label="Зона 2, этап 2-1">
          <span class="stage-medal">✦</span><span class="stage-ribbon">2-1</span>
        </button>

        <button class="stage-node stage-node-boss" data-level="1-3" data-x="253" data-y="1384" aria-label="Этап 1-3, логово Бульдога, закрыт">
          <span class="stage-medal">♜</span><span class="stage-ribbon">1-3</span><span class="stage-name">Логово Бульдога</span>
        </button>
        <button class="stage-node stage-node-current" data-level="1-2" data-x="159" data-y="1672" id="currentStage" aria-label="Текущий этап 1-2, Камни тролля">
          <span class="stage-rays" aria-hidden="true">✦</span><span class="stage-medal"><svg viewBox="0 0 52 52" aria-hidden="true"><path d="M10 39L41 12M14 13l27 28" stroke="#47334c" stroke-width="6" stroke-linecap="round"/><path d="M10 39L41 12M14 13l27 28" stroke="#fff9d5" stroke-width="2" stroke-linecap="round"/></svg></span><span class="stage-ribbon">1-2</span><span class="stage-name">Камни тролля</span>
        </button>
        <button class="stage-node stage-node-done" data-level="1-1" data-x="113" data-y="1971" aria-label="Пройденный этап 1-1, Каменный завал">
          <span class="stage-medal">✓</span><span class="stage-ribbon">1-1</span><span class="stage-name">Каменный завал</span>
        </button>
        <button class="npc-hit" data-sheet="npc" data-x="326" data-y="1639" aria-label="Каменный тролль: необязательное поручение"><span>!</span></button>
        <span class="floating-coin" data-x="65" data-y="1435" aria-hidden="true">✦</span>
        <span class="floating-coin" data-x="324" data-y="2028" aria-hidden="true">✦</span>
      </div>
    </div>

    <button id="jumpCurrent" class="jump-current" aria-label="Вернуться к текущему уровню">⌖ <span>К текущему</span></button>

    <section class="battle-dock" aria-label="Текущий сюжетный этап">
      <div class="battle-dock-art" aria-hidden="true">
        <svg viewBox="0 0 62 62"><path d="m12 18 18-11 18 10 6 23-16 16-24-7-8-17Z" fill="#8e889f" stroke="#403045" stroke-width="3"/><path d="m31 15-8 17 13 0-8 15" fill="none" stroke="#77fff2" stroke-width="5" stroke-linejoin="round"/><path d="M13 19 29 9" stroke="#d4c9e0" stroke-width="3"/></svg>
      </div>
      <div class="battle-info"><strong id="currentStageTitle">1-2 · Камни тролля</strong><span id="currentStageSubtitle">Собери 5 волшебных камней</span></div>
      <button class="battle-button" data-action="battle">В БОЙ!</button>
    </section>

    <nav class="bottom-tabs" aria-label="Нижняя навигация">
      <button class="tab" data-sheet="arsenal" aria-label="Арсенал">
        <svg viewBox="0 0 65 56" aria-hidden="true"><path d="m13 18 7-8 9 2 4 7 9-7 8 5 2 12-8 13-9 6-20-3-8-14Z" fill="#a1769d" stroke="#392c45" stroke-width="3.5" stroke-linejoin="round"/><path d="m24 10 2-8 7 2 1 14M41 12l5-9 7 4-3 13" fill="#c99bc0" stroke="#392c45" stroke-width="3.2" stroke-linejoin="round"/><path d="m23 27 10-5 10 5-5 12H29Z" fill="#fee27b" stroke="#392c45" stroke-width="2"/><path d="m29 29 5 2 5-2-5 9Z" fill="#77e9e2" stroke="#392c45" stroke-width="1.3"/></svg>
        <span>Арсенал</span>
      </button>
      <button class="tab selected" data-action="focus" aria-label="Карта, текущая вкладка">
        <svg viewBox="0 0 65 56" aria-hidden="true"><path d="M5 12 23 5l19 8 18-8v39l-18 7-19-8-18 7Z" fill="#fff0af" stroke="#392c45" stroke-width="3" stroke-linejoin="round"/><path d="m23 6 0 37m19-30v38" stroke="#c9a15a" stroke-width="2"/><path d="M14 33Q29 15 50 35" fill="none" stroke="#d65d5c" stroke-width="3.5" stroke-dasharray="4 5"/><circle cx="50" cy="35" r="5" fill="#d65d5c" stroke="#392c45" stroke-width="2"/><path d="m14 25 7-8 5 10" fill="#83ba85" stroke="#392c45" stroke-width="2"/></svg>
        <span>Карта</span>
      </button>
      <button class="tab" data-sheet="quests" aria-label="Задания">
        <svg viewBox="0 0 65 56" aria-hidden="true"><path d="M18 5h36v38H18Z" fill="#ffe2ab" stroke="#392c45" stroke-width="3"/><path d="M11 6q-7 0-7 8t7 8h7V6Zm7 37q-8-4-8 4 0 7 8 5h36V43Z" fill="#e9b77c" stroke="#392c45" stroke-width="3"/><path d="m25 17 5 4 7-9M25 32l5 4 7-9m5-9h7m-7 15h7" fill="none" stroke="#598c67" stroke-width="3" stroke-linecap="round"/></svg>
        <span>Задания</span><i class="quest-dot" aria-hidden="true"></i>
      </button>
    </nav>

    <div class="sheet-shade" id="sheetShade" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-grab" aria-hidden="true"></div>
        <header class="sheet-header"><span id="sheetTag">СЮЖЕТНЫЙ ЭТАП</span><button id="closeSheet" class="close-sheet" aria-label="Закрыть карточку">✕</button></header>
        <div class="sheet-content" id="sheetContent"></div>
      </section>
    </div>
  </main>
  <div class="desktop-footer"><span>UX-прототип · карта и герои — демонстрационная стилизация</span><a href="https://github.com/artem-chinkov/punchngo-v3-uxflow/tree/main/map" target="_blank" rel="noopener noreferrer">Исходный код ↗</a></div>
</body>
</html>
